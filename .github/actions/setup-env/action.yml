name: Set up environment
description: Install uv, Python, MPI (Linux only) and nox from uv.lock; each nox session installs its own locked dependencies

inputs:
  python-version:
    description: Python version to install
    required: true

runs:
  using: composite
  steps:
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    # The nox sessions build mpi4py from source against MPICH (the variables below are passed on to their `uv sync`).
    # On Windows there is no MPI: the test sessions uninstall mpi4py when no mpiexec is found (see noxfile.py).
    - name: Install MPI (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y mpich libmpich-dev
        {
          echo "MPICC=mpicc"
          echo "MPI4PY_MPI=mpich"
          echo "UV_NO_BINARY_PACKAGE=mpi4py"
        } >> "$GITHUB_ENV"

    # Only the `nox` group (.venv); run the sessions with `uv run --locked --only-group nox nox -s <session>`.
    - name: Install nox
      shell: bash
      run: uv sync --locked --only-group nox
