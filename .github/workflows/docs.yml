name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.14"

      - name: Build the docs
        run: uv run --locked --only-group nox nox -s docs

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.14"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The docs session with other mkdocs arguments (instead of `build --strict`).
      - name: Deploy the docs
        run: uv run --locked --only-group nox nox -s docs -- gh-deploy --force --strict
