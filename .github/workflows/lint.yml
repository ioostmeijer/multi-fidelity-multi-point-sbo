name: Lint

# Runs the pre-commit hooks (Ruff lint and format, mdformat, whitespace and end-of-file fixes) on every push and pull
# request, without a path filter, so documentation-only changes are checked as well. The hooks run the tools from the
# `lint` dependency group at the versions in uv.lock. The slower tests are in ci.yml.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    if: >
      github.event_name != 'push' ||
      (github.event.head_commit && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      # Only the `lint` group (the hook tools at their locked versions); the package itself, and so MPI, isn't needed.
      - name: Install the locked lint tools
        run: uv sync --locked --only-group lint

      - name: Run pre-commit on all files
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
