name: Audit

# Checks the locked dependencies (uv.lock, all groups) for known vulnerabilities with `uv audit` (OSV advisory database).
# Runs when the dependencies change, and weekly, as new advisories appear for unchanged dependencies.
# Runs the `audit` nox session (noxfile.py), which also lists the ignored advisories. Locally:
# `uv run --only-group nox nox -s audit`.

on:
  push:
    branches: [ main, dev ]
    paths: [ 'uv.lock', 'pyproject.toml', 'noxfile.py', '.github/workflows/audit.yml' ]
  pull_request:
    branches: [ main, dev ]
    paths: [ 'uv.lock', 'pyproject.toml', 'noxfile.py', '.github/workflows/audit.yml' ]
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  uv-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run uv audit
        run: uv run --locked --only-group nox nox -s audit
