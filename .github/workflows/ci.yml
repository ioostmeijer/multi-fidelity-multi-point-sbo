name: CI

# Unit tests and deptry, only when code or dependencies change. Linting (pre-commit) is in lint.yml.

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: >
      github.event_name != 'push' ||
      (github.event.head_commit && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check dependency declarations (deptry)
        if: runner.os == 'Linux'
        run: deptry src

      - name: Run non-MPI unit tests
        shell: bash
        run: |
          python -m pytest \
            -n 2 \
            --dist=loadscope \
            --max-worker-restart=0 \
            -m 'unit and not (mpi or mock_mpi)' \
            -q

      - name: Run MPI unit tests (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mpiexec -n 2 python -m pytest --with-mpi -p no:xdist -m '(mpi or mock_mpi) and unit' -q
