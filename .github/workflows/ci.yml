name: CI

# Unit tests and deptry, only when code or dependencies change. Linting (pre-commit) is in lint.yml.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        uses: ./.github/actions/detect-code-changes
        with:
          pattern: '^(src/|tests/|uv\.lock$|pyproject\.toml$|\.github/actions/|\.github/workflows/ci\.yml$)'

  test:
    needs: changes
    # Skipped when no code changed, and on the merge commit of a pull request (already tested on the pull request).
    if: >
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'push' ||
       (github.event.head_commit && !startsWith(github.event.head_commit.message, 'Merge pull request')))
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check dependency declarations (deptry)
        if: runner.os == 'Linux'
        run: deptry src

      - name: Run non-MPI unit tests
        shell: bash
        run: |
          python -m pytest \
            -n 2 \
            --dist=loadscope \
            --max-worker-restart=0 \
            -m 'unit and not (mpi or mock_mpi)' \
            -q

      - name: Run MPI unit tests (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mpiexec -n 2 python -m pytest --with-mpi -p no:xdist -m '(mpi or mock_mpi) and unit' -q

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::A CI job finished with '$result'."
              exit 1
            fi
          done
