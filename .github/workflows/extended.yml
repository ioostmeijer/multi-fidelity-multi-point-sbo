name: Extended tests

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]  # codespell:ignore synchronize
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_verification:
        description: "Run verification tests"
        type: boolean
        default: true
      run_e2e:
        description: "Run E2E tests"
        type: boolean
        default: true
      run_coverage:
        description: "Run coverage report"
        type: boolean
        default: true
  # schedule:
  #   - cron: "0 3 * * 1"   # Mondays 03:00 UTC

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        uses: ./.github/actions/detect-code-changes
        with:
          pattern: '^(src/|tests/|uv\.lock$|pyproject\.toml$|noxfile\.py$|\.github/actions/|\.github/workflows/extended\.yml$)'

  verification:
    name: Verification (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: changes
    if: >
      needs.changes.outputs.code == 'true' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'push' && github.event.head_commit &&
         !startsWith(github.event.head_commit.message, 'Merge pull request')) ||
        github.event_name == 'schedule' || inputs.run_verification)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run non-MPI verification
        run: uv run --locked --only-group nox nox -s "verification-${{ matrix.python-version }}"

  verification-mpi:
    name: Verification MPI (ubuntu-latest)
    needs: changes
    if: >
      needs.changes.outputs.code == 'true' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'push' && github.event.head_commit &&
         !startsWith(github.event.head_commit.message, 'Merge pull request')) ||
        github.event_name == 'schedule' || inputs.run_verification)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.14"

      - name: Run MPI verification
        run: uv run --locked --only-group nox nox -s verification_mpi

  e2e:
    name: E2E (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: changes
    if: >
      needs.changes.outputs.code == 'true' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'push' && github.event.head_commit &&
         !startsWith(github.event.head_commit.message, 'Merge pull request')) ||
        github.event_name == 'schedule' || inputs.run_e2e)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run non-MPI E2E tests
        run: uv run --locked --only-group nox nox -s "e2e-${{ matrix.python-version }}"

  e2e-mpi:
    name: E2E MPI (ubuntu-latest)
    needs: changes
    if: >
      needs.changes.outputs.code == 'true' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'push' && github.event.head_commit &&
         !startsWith(github.event.head_commit.message, 'Merge pull request')) ||
        github.event_name == 'schedule' || inputs.run_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.14"

      - name: Run MPI E2E tests
        run: uv run --locked --only-group nox nox -s e2e_mpi

  coverage:
    name: Coverage (ubuntu-latest)
    if: github.event_name == 'schedule' || inputs.run_coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.14"

      # Non-MPI and MPI tests, combined into coverage.xml.
      - name: Run coverage
        run: uv run --locked --only-group nox nox -s coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  extended-passed:
    name: Extended tests passed
    if: always()
    needs: [changes, verification, verification-mpi, e2e, e2e-mpi, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          echo "Job results: $RESULTS"
          if [[ "$DRAFT" == true ]]; then
            echo "::notice::Draft pull request: the extended tests run once it is marked ready for review."
          fi
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::An extended test job finished with '$result'."
              exit 1
            fi
          done
