# The hooks run the tools installed in the uv environment (the `lint` group in pyproject.toml), so their versions are
# set in one place only: uv.lock. Install them with `uv sync --locked` (or `uv sync --locked --only-group lint`).
# `--no-sync` makes `uv run` use the environment as it is, without installing the full project first.
repos:
  - repo: local
    hooks:
      # Lint first (with fixes, e.g. import sorting), then format, as Ruff recommends.
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Markdown formatting: wrap at 120 characters, consistent lists and aligned tables.
      # mdformat-mkdocs keeps the MkDocs syntax (admonitions, tabs, snippets) intact.
      - id: mdformat
        name: mdformat
        entry: uv run --no-sync mdformat --wrap 120 --number
        language: system
        types: [markdown]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --no-sync end-of-file-fixer
        language: system
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --no-sync trailing-whitespace-fixer
        language: system
        types: [text]
