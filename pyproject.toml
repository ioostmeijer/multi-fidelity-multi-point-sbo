[project]
name = "multi-fidelity-multi-point-sbo"
version = "1.1.0"
description = "Surrogate-based optimisation (SBO) with asynchronous multi-point and/or multi-fidelity infill strategies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ids Oostmeijer"}
]
keywords = ["surrogate-based optimisation", "multi-fidelity", "multi-point", "asynchronous", "parallel computing"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "smt",
    "mpi4py",
    "setuptools>=69,<81",
]

[project.optional-dependencies]
# Deprecated and empty: the benchmark functions are now part of the package
# (sbo.benchmarks). Kept until version 2.0.0, so that existing install commands such as
# pip install "multi-fidelity-multi-point-sbo[benchmarks]" keep working.
benchmarks = []

[dependency-groups]
# Development-only dependencies (PEP 735). Not installed by `pip install multi-fidelity-multi-point-sbo`.
# `uv sync` installs the `dev` group, which includes `test` and `docs`.

# Lean test requirements for running the test suite
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-mpi",
    "mockmpi",
    "coverage",
]

# Documentation requirements for building the documentation
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
]

# Formatters and linters run by the pre-commit hooks. Their versions are locked only here (in uv.lock):
# .pre-commit-config.yaml runs these installed tools instead of installing its own copies.
lint = [
    "pre-commit",
    "pre-commit-hooks",
    "ruff",
    "mdformat",
    "mdformat-mkdocs",
    "mdformat-tables",
    "codespell",
]

# Full dev requirements for development, including testing, documentation and linting
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "lint"},
    "deptry",
]

[project.urls]
Repository = "https://github.com/ioostmeijer/multi-fidelity-multi-point-sbo"
Documentation = "https://ioostmeijer.github.io/multi-fidelity-multi-point-sbo/"
Changelog = "https://github.com/ioostmeijer/multi-fidelity-multi-point-sbo/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 88 is Ruff's (and black's) default; set explicitly so editors and other tools read the same value.
# The target version is inferred from `requires-python` (the oldest supported Python, 3.11).
line-length = 88
# Markdown is formatted by mdformat; Ruff would reflow the (aligned) code examples in the docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, B: bugbear, A: builtins, C4: comprehensions, ANN: annotations,
# D: docstrings, I: import sorting (replaces isort).
select = ["E", "W", "F", "B", "A", "C4", "ANN", "D", "I"]
# D100: missing docstring in public module; D401: first line in imperative mood;
# ANN002/ANN003: missing type annotation for *args/**kwargs.
# (flake8's E203 and W503 conflicted with black; Ruff doesn't enable them. ANN101 was removed from Ruff.)
ignore = ["D100", "D401", "ANN002", "ANN003"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.codespell]
# The default dictionaries (common typos) plus .codespell-en-GB.txt, which flags American spellings (-ize, -or, -er
# and single-l endings) so the text stays British. That file is codespell's en-GB_to_en-US dictionary reversed,
# without the words that are also British: license (the verb, and the MIT License), program (software) and math (the
# Python module, LaTeX). Inline: `codespell:ignore <word>` in a comment ignores that word on that line.
dictionary = ".codespell-en-GB.txt,-"
# The SVGs hold embedded fonts and the lock file hashes.
skip = "*.svg,uv.lock,.codespell-en-GB.txt"
# nd: "nD" (n dimensions).
ignore-words-list = "nd"
# Names from other packages (scipy.optimize, smt's .optimize(), mermaid.initialize, str.capitalize, matplotlib's
# color= and loc="center") and the titles of cited papers, which keep their American spelling.
ignore-regex = '''\.(optimize|initialize|capitalize)\b|\bcolor\s*[=:]|["'](color|center)["']|variable-fidelity surrogate modeling|Surrogate Modeling Toolbox|Optimization and Uncertainty Quantification|Multidisciplinary Optimization|Multi-fidelity optimization|\boptimization,?["”]'''  # codespell:ignore

[tool.pytest.ini_options]
minversion = "6.0"
addopts = " -ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["tests/helpers"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["tests/helpers"]
filterwarnings = [
    "error::DeprecationWarning:sbo",
    "error::FutureWarning:sbo",
]
markers = [
    "unit: fast, isolated unit tests",
    "verification: verification tests, slow",
    "mpi: marks tests that require MPI (Skipped on windows CI)",
    "mock_mpi: marks test that require mock mpi (Skipped on windows CI)",
    "e2e: end-to-end tests that run full workflows",
]

[tool.coverage.run]
source_pkgs = ["sbo"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.deptry]
known_first_party = ["sbo"]

[tool.deptry.per_rule_ignores]
# setuptools is not imported: the <81 pin only keeps an installed mf2 working (it imports
# pkg_resources) while "module": "mf2" is still supported; removed in version 2.0.0
DEP002 = ["setuptools"]

[tool.uv]
# Constrains a transitive dependency without adding it: pymdown-extensions 12 breaks mkdocstrings' highlighter.
constraint-dependencies = ["pymdown-extensions<12"]
